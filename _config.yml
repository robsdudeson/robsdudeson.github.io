# Jekyll Config
# https://jekyllrb.com/docs/configuration/

title: robdudeson's homepage
tagline: Notes, experiments, and project updates.
description: Notes, experiments, and project updates.

author:
  name: "Robby"
  email: "robsdudeson@gmail.com"
  url: "https://robsdudeson.github.io"

home:
  heading: "Hi, I'm Robby."
  intro: "Notes, experiments, and project updates."
  recent_posts_count: 3

baseurl: /
future: true

plugins:
  - jekyll-remote-theme

# jekyll-remote-theme
remote_theme: pages-themes/midnight@v0.2.0

source: .
destination: ./_site
# permalink: /:title

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

gist:
  noscript: false
highlighter: rouge
incremental: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
lsi: false
safe: true
